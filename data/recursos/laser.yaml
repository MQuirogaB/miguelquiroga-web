categorias:
- id: tipografias-y-plantillas
  icono: 🔤
  titulo: Tipografías y plantillas
  items:
  - id: dafont
    titulo: DaFont
    url: https://www.dafont.com/es/
    icono: 🔤
    desc: Archivo de fuentes de descarga gratuita, con búsqueda por estilo, autor o popularidad
    larga: 'Archivo enorme de tipografías de descarga gratuita. Puedes buscar por estilo, autor o popularidad y probar tu propio texto antes de descargar. Antes de usar una fuente en un trabajo, mira su licencia: algunas son solo para uso personal.'
    imagen: images/recursos/dafont.jpg
  - id: templatemaker
    titulo: Templatemaker
    url: https://www.templatemaker.nl/en/
    icono: 📐
    desc: Plantillas de cajas y formas geométricas, gratis y sin registro
    larga: Generador de plantillas de cajas y formas geométricas para cortar con láser, gratis y sin registro. Indicas las medidas y el grosor del material y descargas el archivo listo para cortar.
    imagen: images/recursos/templatemaker.jpg
- id: cajas-y-uniones
  icono: 📦
  titulo: Cajas y uniones
  items:
  - id: gallery-boxes-py
    titulo: Gallery - Boxes.py
    url: https://boxes.hackerspace-bamberg.de/
    icono: 📦
    desc: Generador open source de cajas con uniones de dedo, bisagras y engranajes
    larga: Colección de generadores de cajas de código abierto, con uniones de dedo, bisagras, engranajes y cientos de variantes. Cada diseño se ajusta con las medidas, el grosor del material y el kerf, y se descarga en SVG.
    imagen: images/recursos/gallery-boxes-py.jpg
  - id: makercase
    titulo: MakerCase
    url: https://www.makercase.com/#/
    icono: 📦
    desc: Diseños de cajas para láser y CNC, listos en SVG y DXF
    larga: 'Diseña en el navegador una caja a medida: eliges tipo, medidas, grosor y uniones, y descargas el resultado en SVG o DXF para láser y CNC. Es una de las vías más rápidas para sacar una caja sencilla.'
    imagen: images/recursos/makercase.jpg
  - id: reinforced-open-box
    titulo: Reinforced Open Box
    url: https://cuttle.xyz/@cuttle/Reinforced-Open-Box-with-Finger-Joints-kuXXyUPyimG1
    icono: 📦
    desc: Caja reforzada con uniones de dedo que aguanta más peso
    larga: Plantilla de Cuttle para una caja abierta con uniones de dedo y refuerzos, pensada para aguantar más peso. Se ajusta a tus medidas y al grosor del material.
    etiquetas:
    - Cuttle
    imagen: images/recursos/reinforced-open-box.jpg
  - id: cardstock-polygon-box
    titulo: Cardstock Polygon Box
    url: https://cuttle.xyz/@cuttle/Cardstock-Polygon-Box-Ar6cqKXEMfy3
    icono: 📦
    desc: Caja plegable de una sola pieza de cartulina, sin pegamento
    larga: Plantilla de Cuttle para una caja poligonal que se pliega a partir de una sola pieza de cartulina, sin pegamento. Muy buena para trabajar con papel en el aula.
    etiquetas:
    - Cuttle
    imagen: images/recursos/cardstock-polygon-box.jpg
- id: joyeria-con-incrustaciones
  icono: 💍
  titulo: Joyería con incrustaciones
  items:
  - id: curved-wedge-inlay-earrings
    titulo: Curved Wedge Inlay Earrings
    url: https://cuttle.xyz/@cuttle/Curved-Wedge-Inlay-Earrings-gFXPZTXpMb6n
    icono: 💍
    desc: Pendientes con incrustaciones a presión, ajustadas al kerf
    larga: Plantilla de Cuttle para pendientes con piezas incrustadas a presión. El diseño compensa el kerf del láser para que las piezas encajen justas.
    etiquetas:
    - Cuttle
    imagen: images/recursos/curved-wedge-inlay-earrings.jpg
  - id: cat-face-inlay-earrings
    titulo: Cat Face Inlay Earrings
    url: https://cuttle.xyz/@cuttle/Cat-Face-Inlay-Earrings-BhwlGSh34Fr4
    icono: 🐱
    desc: Pendientes con forma de gato e incrustación a presión
    larga: Pendientes con forma de cara de gato, con incrustación a presión y ajuste del kerf, listos para cortar con láser.
    etiquetas:
    - Cuttle
    imagen: images/recursos/cat-face-inlay-earrings.jpg
  - id: rounded-teardrop-inlay-earrings
    titulo: Rounded Teardrop Inlay Earrings
    url: https://cuttle.xyz/@cuttle/Rounded-Teardrop-Inlay-Earrings-E8aplkd4gPhA
    icono: 💧
    desc: Pendientes en forma de lágrima con incrustación a presión
    larga: Pendientes en forma de lágrima con incrustación a presión. Combina dos materiales o colores y ajusta el kerf desde la propia plantilla.
    etiquetas:
    - Cuttle
    imagen: images/recursos/rounded-teardrop-inlay-earrings.jpg
- id: texto-llaveros-y-personalizados
  icono: 🏷️
  titulo: Texto, llaveros y personalizados
  items:
  - id: block-of-text-generator
    titulo: Block of Text Generator
    url: https://cuttle.xyz/@cuttle/Block-of-Text-Generator-qQNRwDWVT9iN
    icono: 🧱
    desc: Convierte cualquier texto en un bloque cortable, tipo posavasos
    larga: Escribes un texto y lo convierte en un bloque cortable en el que las letras quedan unidas, al estilo de un posavasos. Sirve para nombres, palabras y regalos personalizados.
    etiquetas:
    - Cuttle
    imagen: images/recursos/block-of-text-generator.jpg
  - id: llavero-emoji
    titulo: Llavero de emoji
    url: https://miguelquiroga.es/llavero_emoji/
    icono: 🐢
    desc: Llavero con el emoji que elijas grabado y borde de corte en rojo, con anilla opcional, en SVG para láser
    larga: 'Elige un emoji y descarga un SVG listo para el láser: el emoji se graba en negro y alrededor lleva un borde de corte en rojo que lo sigue, con un margen que tú ajustas. Puedes añadir una anilla para colgarlo como llavero (seis posiciones, con tamaño de agujero y grosor de madera) y cambiar los colores. Todo ocurre en el navegador.'
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/llavero-emoji.jpg
  - id: palabra-para-laser
    titulo: Palabra para láser
    url: https://miguelquiroga.es/carteles_svg/
    icono: 🔤
    desc: Escribes una palabra y obtienes el contorno de las letras en negro y un reborde de corte en rojo, en SVG para láser
    larga: 'Escribe una palabra o una frase, elige tipografía y tamaño, y descarga un SVG listo para el láser: el contorno de las letras en negro y, alrededor, un reborde de corte en rojo a la distancia que tú elijas (con casilla y deslizador). Puedes cambiar las esquinas del reborde, unir las letras para que salga en una sola pieza, cortar también alrededor de los huecos (o, a, e…) y dibujar las letras como contorno o como relleno. Todo ocurre en el navegador.'
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/palabra-para-laser.jpg
  - id: cartel-laser
    titulo: Cartel láser
    url: https://miguelquiroga.es/cartel_laser/
    icono: 🏷️
    desc: Carteles con texto en varias tipografías, emoji opcional y agujeros, en SVG con el corte en rojo
    larga: Escribe un texto, elige tipografía, añade un emoji opcional (arriba, abajo, izquierda o derecha) y agujeros de sujeción a un lado o a los dos. Descargas un SVG listo para el láser, con el borde de corte en rojo y el grabado en negro, y el texto ya convertido a trazados.
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/cartel-laser.jpg
  - id: carteles-con-pictogramas
    titulo: Carteles con pictogramas
    url: https://miguelquiroga.es/carteles_pictos/
    icono: 🖼️
    desc: Pictograma ARASAAC y texto opcional en una placa para cortar, también en lote (ZIP)
    larga: Busca un pictograma de ARASAAC, añade texto opcional y descarga una placa en SVG para cortar y grabar con láser. Permite hacer lotes de carteles y bajarlos en un ZIP. Pensado para carteles accesibles en el aula.
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/carteles-con-pictogramas.jpg
  - id: marcadores-de-plantas
    titulo: Marcadores de plantas
    url: https://miguelquiroga.es/mardacor_plantas/
    icono: 🌱
    desc: Marcadores con estaca en 8 formas, con texto y emoji, en SVG para láser
    larga: Ocho formas de marcador con estaca (cápsula, rectángulo, óvalo, trapecios, unión curva…), con texto en varias tipografías, emoji opcional y agujeros. Descargas un SVG para láser con el corte en rojo.
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/marcadores-de-plantas.jpg
- id: puzles-y-mecanismos
  icono: 🧩
  titulo: Puzles y mecanismos
  items:
  - id: generador-de-puzles
    titulo: Generador de puzles
    url: https://miguelquiroga.es/puzzle_svg/
    icono: 🧩
    desc: 'Puzles para cortar con láser: elige tamaño, número y tipo de pieza, con marco y base opcionales, en un SVG de un solo color'
    larga: Elige el tamaño, el número de piezas y el tipo de pieza (clásica con lengüetas, recta, ondulada, hexagonal o triangular) y descarga un SVG listo para cortar. Todo va de un solo color y cada línea de corte aparece una sola vez, así que el láser no pasa dos veces por el mismo sitio. Puedes añadir un marco alrededor del puzle y una base para pegarlo. Todo ocurre en el navegador.
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/generador-de-puzles.jpg
  - id: lasercutmazes
    titulo: LaserCutMazes
    url: https://adashrod.github.io/LaserCutMazes/welcome
    icono: 🧩
    desc: Generador de laberintos para corte láser
    larga: Generador de laberintos para cortar con láser. Eliges el tamaño y el tipo de laberinto y descargas el diseño listo para cortar.
    imagen: images/recursos/lasercutmazes.jpg
  - id: walking-man-automaton
    titulo: Walking Man Automaton
    url: https://cuttle.xyz/@cuttle/Walking-Man-Automaton-7ztueWP9CkLU
    icono: 🚶
    desc: Juguete cinético de una persona andando, en madera contrachapada
    larga: 'Plantilla de Cuttle de un autómata de madera contrachapada: un muñeco que anda al girar una manivela. Buen proyecto para ver mecanismos y movimiento en el taller.'
    etiquetas:
    - Cuttle
    imagen: images/recursos/walking-man-automaton.jpg
  - id: puzle-de-formulacion
    titulo: Puzle de formulación
    url: https://miguelquiroga.es/puzzle_formulacion/
    icono: ⚗️
    desc: Piezas de cationes y aniones que encajan por su carga, para enseñar formulación; SVG para láser y STL para 3D
    larga: 'Elige cationes y aniones de una lista larga (compuestos binarios) y ve cómo se construyen las piezas: cada ion tiene tantas pestañas o huecos como su carga, de modo que solo encajan las combinaciones correctas. Ajusta tamaño, tolerancia, grosor y texto, y descarga un SVG para cortar con láser (corte en rojo, texto grabado en negro) o un STL para imprimir en 3D (en relieve o incrustado). Todo ocurre en el navegador.'
    etiquetas:
    - Hecho por mí
    imagen: images/recursos/puzzle-formulacion.jpg

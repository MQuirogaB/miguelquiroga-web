backend:
  name: github
  repo: MQuirogaB/miguelquiroga-web
  branch: main
  base_url: https://decap-cms-auth.miguel-quiroga-fyq.workers.dev

publish_mode: simple
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  - name: "laboratorio"
    label: "🔬 Laboratorio"
    folder: "content/laboratorio"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Icono (emoji)", name: "icon", widget: "string" }
      - { label: "Foto principal", name: "foto", widget: "image", required: false }
      - label: "Tipología"
        name: "tipologia"
        widget: "select"
        multiple: true
        required: false
        options: ["Investigación", "STEAM", "Maker", "Demostración", "Curiosidad"]
      - label: "Temática"
        name: "tematica"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Leyes de los gases"
          - "Cinemática"
          - "Dinámica"
          - "Energía"
          - "Electricidad y magnetismo"
          - "Ondas"
          - "Química"
          - "Óptica"
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "materiales"
    label: "🔬 Materiales"
    folder: "content/materiales"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Icono (emoji)", name: "icon", widget: "string" }
      - { label: "Foto principal", name: "foto", widget: "image", required: false }
      - label: "Curso"
        name: "curso"
        widget: "select"
        multiple: true
        required: false
        options: ["1º ESO", "2º ESO", "3º ESO", "4º ESO", "1º Bach", "2º Bach"]
      - label: "Bloque"
        name: "bloque"
        widget: "select"
        multiple: true
        required: false
        options: ["Cinemática", "Dinámica", "Energía", "Electricidad", "Ondas", "Química", "Óptica", "Gravitación"]
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        multiple: true
        required: false
        options: ["Ejercicio", "Curiosidad", "Material audiovisual", "Práctica", "Juego"]
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "astronomia_mitologia"
    label: "🪐 Astronomía — Mitología de constelaciones"
    folder: "content/astronomia/mitologia-de-las-constelaciones"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Icono (emoji)", name: "icon", widget: "string" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "astronomia_paginas"
    label: "🪐 Astronomía — Otras páginas"
    files:
      - name: "familia_black"
        label: "📄 La Familia Black (Harry Potter)"
        file: "content/astronomia/familia-black-harry-potter.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Icono (emoji)", name: "icon", widget: "string" }
          - { label: "Resumen", name: "resumen", widget: "string" }
          - { label: "Título corto", name: "titulo_corto", widget: "string" }
          - { label: "Contenido", name: "body", widget: "markdown" }
      - name: "mizar_alcor"
        label: "📄 Mizar y Alcor"
        file: "content/astronomia/mizar-y-alcor.md"
        fields:

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="topbar">
   <a class="brand" href="{{ .Site.Home.RelPermalink }}">miguelquiroga<span class="dot">.es</span></a>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="foot">
    <p>Hecho con ♥ para el aula de Física y Química — piloto Hugo (sin publicar)</p>
  </footer>
</body>
</html>

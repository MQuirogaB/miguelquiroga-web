{{ define "main" }}
<section class="intro">
  <div class="cover-strip"></div>
  <div class="page-icon">{{ .Params.intro_icon }}</div>
  <h1>{{ .Title }}</h1>
  <p>{{ .Params.intro }}</p>
</section>

<div class="card-grid">
  {{ range .Params.sections }}
  {{ $target := $.Site.GetPage .link }}
  {{ if $target }}
  <a class="card" href="{{ $target.RelPermalink }}">
    <span class="card-icon">{{ .icon }}</span>
    <span class="card-title">{{ .title }}</span>
  </a>
  {{ else }}
  <div class="card card-soon">
    <span class="card-icon">{{ .icon }}</span>
    <span class="card-title">{{ .title }}</span>
    <span class="tag">próximamente en el piloto</span>
  </div>
  {{ end }}
  {{ end }}
</div>
{{ end }}
